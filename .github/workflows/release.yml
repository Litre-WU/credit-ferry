name: Release

on:
  push:
    tags:
      - "v*"
  # Manual runs from the Actions UI. When re-running for an EXISTING tag
  # (e.g. adding macOS bundles to a release created via the API, which never
  # emits a push event), pick `refs/tags/vX.Y.Z` in the branch dropdown —
  # the publish job below keys off the ref, not the event name.
  workflow_dispatch:

permissions:
  contents: write

env:
  APP_NAME: CreditFerry

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            arch: x86_64
            bundleDir: src-tauri/target/release/bundle
          # Apple Silicon, native host build.
          - os: macos-latest
            arch: aarch64
            bundleDir: src-tauri/target/release/bundle
          # Intel: macos-13 runners sit queued indefinitely, so cross-compile
          # the x86_64 target on an Apple Silicon runner instead.
          - os: macos-latest
            arch: x86_64
            rustTarget: x86_64-apple-darwin
            tauriArgs: --target x86_64-apple-darwin
            bundleDir: src-tauri/target/x86_64-apple-darwin/release/bundle

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Rust stable toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Add cross-compile target
        if: matrix.rustTarget
        run: rustup target add ${{ matrix.rustTarget }}

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      # `npm run tauri build` is what tauri-action invokes, so the CLI declared
      # in devDependencies has to be installed first.
      - name: Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install npm dependencies
        run: npm ci

      # NSIS is required to build the Windows .exe installer (targets: all -> msi + nsis)
      - name: Install NSIS (Windows)
        if: runner.os == 'Windows'
        run: choco install -y nsis

      # create-dmg is required to build the macOS .dmg
      - name: Install create-dmg (macOS)
        if: runner.os == 'macOS'
        run: npm install -g create-dmg

      - name: Build with Tauri
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: src-tauri
          includeDebug: false
          includeRelease: true
          includeUpdaterJson: false
          args: ${{ matrix.tauriArgs }}

      - name: Collect installer artifacts
        shell: bash
        run: |
          set -e
          BUNDLE=${{ matrix.bundleDir }}
          # Absolute: the macOS branch below cd's into the bundle dir.
          OUT="$GITHUB_WORKSPACE/dist"
          rm -rf "$OUT"; mkdir -p "$OUT"
          echo "=== bundle dir ==="; ls -R "$BUNDLE" 2>/dev/null | head -40
          # Windows installers: NSIS .exe + MSI
          find "$BUNDLE" -type f \( -name "*.msi" -o -name "*.dmg" \) -exec cp -f {} "$OUT/" \; 2>/dev/null || true
          find "$BUNDLE" -type f -name "*.exe"  -exec cp -f {} "$OUT/" \; 2>/dev/null || true
          # macOS: the .app is a directory -> ship it as a tarball next to the .dmg
          if [ -d "$BUNDLE/macos" ]; then
            APP=$(ls -d "$BUNDLE"/macos/*.app 2>/dev/null | head -1)
            if [ -n "$APP" ]; then
              ( cd "$(dirname "$APP")" && tar -czf "$OUT/${APP_NAME}-${{ matrix.arch }}.app.tar.gz" "$(basename "$APP")" )
            fi
          fi
          echo "=== final $OUT ==="; ls -l "$OUT"

      - name: Upload per-OS artifacts
        uses: actions/upload-artifact@v4
        with:
          # runner.os keeps Windows-x86_64 and macOS-x86_64 artifact names distinct
          name: ${{ env.APP_NAME }}-${{ runner.os }}-${{ matrix.arch }}
          path: dist/
          if-no-files-found: warn

  publish:
    needs: build
    # Key off the ref, not the event: a manual run pointed at refs/tags/v*
    # must publish just like a tag push does (API-created tags emit no push).
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist/
          merge-multiple: true

      - name: Flatten nested artifact folders
        run: |
          cd dist
          for d in */; do
            [ -d "$d" ] && mv -f "$d"* . 2>/dev/null || true
          done
          echo "=== release files ==="; find . -type f | sort

      - name: Create / update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            dist/*.msi
            dist/*.exe
            dist/*.dmg
            dist/*.tar.gz
